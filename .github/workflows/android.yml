name: FIT Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "capacitor.config.ts"
      - "vite.config.js"
      - "index.html"
      - ".github/workflows/android.yml"
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK components
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses && "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm run build
      - run: npm run android:add
      - name: Set Android minimum SDK required by Health plugin
        run: |
          test -f android/variables.gradle
          sed -i 's/minSdkVersion = [0-9][0-9]*/minSdkVersion = 26/' android/variables.gradle
          grep -n 'minSdkVersion' android/variables.gradle
      - run: npm run android:sync
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FIT-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
